<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>My CMU Academy Projects</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <p class="eyebrow">CMU Academy</p>
        <h1>My Projects</h1>
        <p class="intro">A collection of the projects I made in Units 1–3.</p>
      </div>
    </header>

    <main class="page-content">
      <section class="projects" aria-label="CMU Academy projects">
        <article class="project-card">
          <div class="card-heading">
            <span class="project-number">01</span>
            <div class="project-title">
              <p class="unit-label">Unit 1</p>
              <h2>First steps</h2>
            </div>
            <button class="fullscreen-button" type="button" data-fullscreen="unit-1" aria-label="Fullscreen Unit 1 project">⛶ <span>Fullscreen</span></button>
          </div>
          <div class="project-frame">
            <iframe id="unit-1" title="CMU Academy Unit 1 project" src="https://academy.cs.cmu.edu/sharing/skyBlueLobster709293" loading="lazy" allowfullscreen></iframe>
          </div>
        </article>

        <article class="project-card">
          <div class="card-heading">
            <span class="project-number">02</span>
            <div class="project-title">
              <p class="unit-label">Unit 2</p>
              <h2>Building skills</h2>
            </div>
            <button class="fullscreen-button" type="button" data-fullscreen="unit-2" aria-label="Fullscreen Unit 2 project">⛶ <span>Fullscreen</span></button>
          </div>
          <div class="project-frame">
            <iframe id="unit-2" title="CMU Academy Unit 2 project" src="https://academy.cs.cmu.edu/sharing/fuchsiaSquirrel647734/embed" loading="lazy" allowfullscreen></iframe>
          </div>
        </article>

        <article class="project-card">
          <div class="card-heading">
            <span class="project-number">03</span>
            <div class="project-title">
              <p class="unit-label">Unit 3</p>
              <h2>Latest project</h2>
            </div>
            <button class="fullscreen-button" type="button" data-fullscreen="unit-3" aria-label="Fullscreen Unit 3 project">⛶ <span>Fullscreen</span></button>
          </div>
          <div class="project-frame">
            <iframe id="unit-3" title="CMU Academy Unit 3 project" src="https://academy.cs.cmu.edu/sharing/greenEagle331548/embed" loading="lazy" allowfullscreen></iframe>
          </div>
        </article>
      </section>

      <footer class="site-footer">
        <img src="https://www.chess.com/bundles/web/images/leagues/badges/crystal.svg" alt="Crystal League badge" width="48" height="30" loading="lazy" decoding="async">
        <p> CMU Academy Project made by Rustyweasel</p>
      </footer>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
